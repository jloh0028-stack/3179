<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Townsville Bird Map</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Vega libraries -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <style>
    html, body { margin: 0; }
    /* Keep both visualisations nicely centered */
    #vis, #timeline { max-width: 1100px; margin: 0 auto; }
    .vega-actions { display: none; }

    /* Wrap the MAP in a positioned container so the slider can be placed relative to it */
    .viz { position: relative; padding-bottom: 56px; } /* space for the slider */

    /* Center the year slider just under the map */
    .vega-bindings{
      position: absolute;
      bottom: 16px;     /* distance below the map */
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: transparent;
    }

    /* Small header for the timeline */
    .subhead{
      max-width: 1100px;
      margin: 18px auto 8px;
      font: 600 16px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color:#344054;
    }
  </style>
</head>
<body>

  <!-- MAP (slider will attach inside this wrapper) -->
  <div class="viz">
    <div id="vis"></div>
  </div>

  <!-- TIMELINE -->
  <h3 class="subhead">Total birds in Townsville from 1998 to 2005</h3>
  <div id="timeline" style="max-width:1100px;margin:24px auto 60px;"></div>

  <!-- MELBOURNE: Total birds per year (area + brush) -->
<h3 class="subhead">Total birds in Melbourne by year</h3>
<div id="melbourne_timeline" style="max-width:1100px;margin:24px auto 60px;"></div>


<script>
const spec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  /* === New title === */
  title: {
    text: "Map of Bird Population in Townsville (1975–2024)",
    fontSize: 22,
    font: "sans-serif",
    anchor: "middle",
    color: "#333"
  },
  width: 1100,
  height: 700,
   /* === Controls: year, zoom, center === */
  params: [
    {
      name: "year",
      value: 2018,
      bind: { input: "range", min: 1975, max: 2024, step: 1, name: "year" }
    },
    {
      name: "zoom_level",
      value: 35000,  /* roughly your previous scale */
      bind: {
        input: "range",
        min: 9000,
        max: 120000,
        step: 500,
        name: "zoom: "
      }
    },
    {
      name: "center_to",
      value: [146.80, -19.25],  /* Townsville CBD-ish */
      bind: {
        input: "select",
        options: [
          [146.80, -19.25],  /* Townsville City */
          [146.85, -19.13],  /* Magnetic Island */
          [146.77, -19.33],  /* Ross River Dam */
          [146.69, -19.24],  /* Bohle / Town Common */
          [146.92, -19.27]   /* Cleveland Bay */
        ],
        labels: [
          "Townsville City",
          "Magnetic Island",
          "Ross River Dam",
          "Bohle / Town Common",
          "Cleveland Bay"
        ],
        name: "centre: "
      }
    }
  ],

  /* === Projection responds to controls === */
  projection: {
    type: "mercator",
    center: { expr: "center_to" },
    scale:  { expr: "zoom_level" }
  },
  layer: [
    // 1) Ocean
    { data: { sphere: true }, mark: { type: "geoshape", fill: "#e7f2ff" } },

    // 2) Land (Australia only)
    {
      data: { url: "Mapdata.json", format: { type: "topojson", feature: "ne_110m_admin_0_countries" } },
      transform: [{ filter: "datum.properties.ADMIN === 'Australia'" }],
      mark: { type: "geoshape", fill: "#f3f0e8", stroke: "#b9bec5", strokeWidth: 1 }
    },
    // 3) Geography regions (polys) — keep subtle and below marine layer
    {
      data: { url: "Mapdata.json", format: { type: "topojson", feature: "ne_110m_geography_regions_polys" } },
      mark: {
        type: "geoshape",
        fill: "#a6e3a1",              
        stroke: "#79c27a",
        strokeWidth: 0.8,
        opacity: 0.5                 
      },
      encoding: {
        tooltip: [
          { field: "name", title: "Region" },
          { field: "featurecla", title: "Class" }
        ]
      }
    },
    // 4) Marine polygons (names of seas/ocean regions) — draw AFTER regions so the blue stays visible
    {
      data: { url: "Mapdata.json", format: { type: "topojson", feature: "ne_110m_geography_marine_polys" } },
      mark: {
        type: "geoshape",
        fill: "#bfe3ff",              
        stroke: "#9dc8ef",
        strokeWidth: 0.5,
        opacity: 0.30                 
      },
      encoding: {
        tooltip: [
          { field: "name", title: "Marine area" },
          { field: "featurecla", title: "Class" }
        ]
      }
    },
    

    // 5) Lakes
    {
      data: { url: "Mapdata.json", format: { type: "topojson", feature: "ne_110m_lakes" } },
      mark: { type: "geoshape", fill: "#35a2b5", stroke: "#9cbbe6", strokeWidth: 1, opacity: 10 }
    },


    // 6) Rivers
    {
      data: { url: "Mapdata.json", format: { type: "topojson", feature: "ne_110m_rivers_lake_centerlines" } },
      mark: { type: "geoshape", fill: "#35a2b5", stroke: "#35a2b5", strokeWidth: 10, opacity:2 }
    },

    // 7) Coastline
    {
      data: { url: "Mapdata.json", format: { type: "topojson", feature: "ne_110m_coastline" } },
      mark: { type: "geoshape", fill:"#e3c06f", stroke: "#e3c06f", strokeWidth: 0.9, opacity: 0.30 }
    },

    // 8) Graticules
    {
      data: { url: "Mapdata.json", format: { type: "topojson", feature: "ne_110m_graticules_1" } },
      mark: { type: "geoshape", stroke: "#96190b", strokeWidth: 0.30, opacity: 0.25 }
    },

    // 9) Bird points
    {
  data: { url: "birdata-townsville_WITH_ALL_COORDS.csv" },
  transform: [
    // convert to numeric lat/lon
    { calculate: "toNumber(datum.lat)", as: "lat" },
    { calculate: "toNumber(datum.lon)", as: "lon" },
    { filter: "isValid(datum.lat) && isValid(datum.lon)" },

    // >>> Extract year from Count_Date <<<
    { calculate: "year(toDate(datum.Count_Date))", as: "Year" },

    // >>> Filter by slider param <<<
    { filter: "datum.Year == year" },

    // aggregate bird counts per location
    { aggregate: [{ op: "sum", field: "Count", as: "TotalCount" }],
      groupby: ["lat","lon","Suburb", "Year"] }
  ],
  mark: { type: "circle", opacity: 3, stroke: "white", strokeWidth: 0.7 },
  encoding: {
    longitude: { field: "lon", type: "quantitative" },
    latitude:  { field: "lat", type: "quantitative" },

    // adjust size scale so points are easier to see
    size:  { field: "TotalCount", type: "quantitative",
             title: "Bird count", scale: { range: [50, 2000] } },

    color: { field: "TotalCount", type: "quantitative",
             title: "Bird count", scale: { scheme: "reds" } },

    tooltip: [
      { field: "Suburb", title: "Location" },
      { field: "Year", title: "Year" },
      { field: "TotalCount", title: "Total birds" },
      { field: "lat", title: "Lat", format: ".5f" },
      { field: "lon", title: "Lon", format: ".5f" }
    ]
  }
},
// 10) Top-2 labels for highest bird counts
  {
    data: { url: "birdata-townsville_WITH_ALL_COORDS.csv" },
    transform: [
      { calculate: "toNumber(datum.lat)", as: "lat" },
      { calculate: "toNumber(datum.lon)", as: "lon" },
      { filter: "isValid(datum.lat) && isValid(datum.lon)" },
      { calculate: "year(toDate(datum.Count_Date))", as: "Year" },
      { filter: "datum.Year == year" },
      { aggregate: [{ op: "sum", field: "Count", as: "TotalCount" }],
        groupby: ["lat","lon","Suburb","Year"] },
      { window: [{ op: "rank", as: "r" }],
        sort: [{ field: "TotalCount", order: "descending" }] },
      { filter: "datum.r <= 2" },
      { calculate: "datum.Suburb + ': ' + format(datum.TotalCount, ',')", as: "label" }
    ],
    mark: {
      type: "text",
    dy: -12,
    fontSize: 14,
    font: "sans-serif",
    fontWeight: "bold",
  // crisp, subtle halo:
    fill: "#111",
    stroke: "black",
    strokeWidth: 1,     // was 3 — makes it look blurry
    strokeJoin: "round"
    },
    encoding: {
      longitude: { field: "lon", type: "quantitative" },
      latitude:  { field: "lat", type: "quantitative" },
      text:      { field: "label" }
    }
  }
  ],
  config: { view: { stroke: null } }
};
vegaEmbed("#vis", spec, { 
  actions: false,
  renderer: "svg"   // ✅ this makes your labels crisp
});
/* === New TIMELINE chart code === */
  const timelineSpec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  data: { url: "birdata-townsville_WITH_ALL_COORDS.csv" },
  title: {
    text: "Total birds in Townsville from 1998 to 2005",
    fontSize: 22,
    font: "sans-serif",
    anchor: "middle",
    color: "#333"
  },

  transform: [
    // Extract year from Count_Date and convert Count to number
    { calculate: "year(toDate(datum.Count_Date))", as: "YearNum" },
    { calculate: "toNumber(datum.Count)", as: "CountNum" },

    // keep valid rows and restrict to 1998–2005
    { filter: "isValid(datum.YearNum) && isValid(datum.CountNum)" },
    { filter: "datum.YearNum >= 1998 && datum.YearNum <= 2005" },

    // aggregate to yearly totals
    { aggregate: [{ op: "sum", field: "CountNum", as: "TotalCount" }], groupby: ["YearNum"] }
  ],

  vconcat: [
    {
      width: 1100,
      height: 300,
      mark: { type: "line", stroke: "#4C78A8", strokeWidth: 2, interpolate: "monotone", point: true },
      encoding: {
        x: {
          field: "YearNum",
          type: "quantitative",
          scale: { domain: { param: "brush" } },
          axis: { title: "Year", format: ".0f", tickMinStep: 1, tickCount: 5  }
        },
        y: {
          field: "TotalCount",
          type: "quantitative",
          title: "Total Bird Count",
          axis: { titlePadding: 10 }
        },
        tooltip: [
          { field: "YearNum", type: "quantitative", title: "Year", format: ".0f" },
          { field: "TotalCount", type: "quantitative", title: "Bird Count", format: "," }
        ]
      }
    },
    {
      width: 1100,
      height: 80,
      mark: { type: "line", stroke: "#4C78A8", strokeWidth: 2, interpolate: "monotone", point: true },
      params: [{ name: "brush", select: { type: "interval", encodings: ["x"] } }],
      encoding: {
        x: { field: "YearNum", type: "quantitative", axis: { title: "Year", format: ".0f", tickMinStep: 1 } },
        y: { field: "TotalCount", type: "quantitative", axis: { title: "Total Bird Count", grid: false } }
      }
    }
  ],

  config: {
    axis: { labelFontSize: 14, titleFontSize: 14 },
    view: { stroke: null }
  }
};

vegaEmbed("#timeline", timelineSpec, { actions: false });
const melbTimelineSpec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",

  data: { url: "environment-bird-atlas-city-of-greater-geelong.csv" },

  title: {
    text: "Total birds in Melbourne from 1998 to 2005",
    fontSize: 22,
    font: "sans-serif",
    anchor: "middle",
    color: "#333"
  },

  

  transform: [
    { calculate: "split(datum.start_date, '/')", as: "dparts" },
    { calculate: "toDate(datum.dparts[2] + '-' + datum.dparts[1] + '-' + datum.dparts[0])", as: "Date" },
    { calculate: "year(datum.Date)", as: "Year" },
    { calculate: "toNumber(datum.species_nu)", as: "CountNum" },
    { filter: "isValid(datum.CountNum) && isValid(datum.Year)" },
    
    { aggregate: [{ op: "sum", field: "CountNum", as: "TotalCount" }], groupby: ["Year"] }
  ],

  vconcat: [
    {
      width: 1100,
      height: 300,
      mark: {
      type: "area",
      color: "#4CAF50"   // 🌿 green shade
  },
      encoding: {
        x: { field: "Year", type: "quantitative", scale: { domain: { param: "brush" } },
             axis: { title: "Year", format: ".0f", tickMinStep: 1 } ,tickCount: 5 },
        y: { field: "TotalCount", type: "quantitative", title: "Total Bird Count",
             axis: { titlePadding: 10 } },
        tooltip: [
          { field: "Year", type: "quantitative", title: "Year", format: ".0f" },
          { field: "TotalCount", type: "quantitative", title: "Bird Count", format: "," }
        ]
      }
    },
    {
      width: 1100,
      height: 80,
      mark: {
      type: "area",
      color: "#4CAF50"   // 🌿 green shade
  },
      params: [{ name: "brush", select: { type: "interval", encodings: ["x"] } }],
      encoding: {
        x: { field: "Year", type: "quantitative", axis: { title: "Year", format: ".0f", tickMinStep: 1 } },
        y: { field: "TotalCount", type: "quantitative", axis: { title: "Total Bird Count", grid: false } }
      }
    }
  ],

  config: { axis: { labelFontSize: 14, titleFontSize: 14 }, view: { stroke: null } }
};

vegaEmbed("#melbourne_timeline", melbTimelineSpec, { actions: false });


</script>
</body>
</html>
